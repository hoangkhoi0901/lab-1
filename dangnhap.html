<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập</title>
</head>
<body id="top">

<header>
    <h1>FreezeeVN</h1>

    <nav>
        <a href="index.html">Trang Chủ</a>
        <a href="#">Giới Thiệu</a>
        <a href="#">Sản Phẩm</a>
        <a href="#">Tin Tức</a>
        <a href="dangnhap.html">Đăng Nhập</a>
        <a href="dangky.html">Đăng Ký</a>
        <a href="#">Liên Hệ</a>
    </nav>
</header>

<hr>

<main>
    <form action="#" method="post">
        <fieldset>
            <legend><b>ĐĂNG NHẬP</b></legend>

            <table>
                <tr>
                    <td colspan="2" align="center">
                        <h2>Avatar</h2>
                    </td>
                </tr>

                <tr>
                    <td><label for="uname"><b>Email</b></label></td>
                    <td>
                        <input id="uname" type="text" placeholder="Nhập email" name="uname" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="psw"><b>Mật khẩu</b></label></td>
                    <td>
                        <input id="psw" type="password" placeholder="Nhập mật khẩu" name="psw" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <button type="submit">Đăng Nhập</button>
                        <button type="button">Hủy</button>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <span>Bạn quên <a href="#">Mật Khẩu?</a></span>
                        <span>
                            <input type="checkbox" checked name="remember">
                            Ghi nhớ cho lần đăng nhập sau
                        </span>
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
</main>

</body>
</html>
