<main>

<form action="#"
      method="post"
      enctype="application/x-www-form-urlencoded">

    <fieldset>

        <legend><b>ĐĂNG NHẬP</b></legend>

        <table>

            <tr>
                <td align="center" colspan="2">
                    <img src="images/dangnhap/userlogin.png"
                         alt="Avatar"
                         width="200">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="uname">
                        <b>Email</b>
                    </label>
                </td>

                <td>
                    <input id="uname"
                           type="text"
                           placeholder="Nhập email"
                           name="uname"
                           required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="psw">
                        <b>Mật khẩu</b>
                    </label>
                </td>

                <td>
                    <input id="psw"
                           type="password"
                           placeholder="Nhập mật khẩu"
                           name="psw"
                           required>
                </td>
            </tr>

            <tr>
                <td align="center" colspan="2">
                    <button type="submit">
                        Đăng Nhập
                    </button>

                    <button type="button">
                        Hủy
                    </button>
                </td>
            </tr>

            <tr>
                <td colspan="2">

                    <span>
                        Bạn quên
                        <a href="#">Mật Khẩu?</a>
                    </span>

                    <span>
                        <input type="checkbox"
                               checked="checked"
                               name="remember">
                        Ghi nhớ cho lần đăng nhập sau
                    </span>

                </td>
            </tr>

        </table>

    </fieldset>

</form>

</main>
